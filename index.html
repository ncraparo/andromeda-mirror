<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andromeda Zoom</title>
<meta name="apple-mobile-web-app-title" content="Andromeda Zoom">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Andromeda Zoom">
<meta property="og:description" content="Zoom in on the sharpest ever view of a section of the Andromeda Galaxy, all the way down to individual stars.">
<meta property="og:url" content="https://ncraparo.github.io/andromeda-mirror/">
<meta property="og:image" content="https://ncraparo.github.io/andromeda-mirror/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; overscroll-behavior: none; }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; cursor: grab;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #view.dragging { cursor: grabbing; }
  #view:focus-visible { outline: 2px solid #8ab4ff; outline-offset: -4px; }
  .controls {
    position: fixed; z-index: 10; display: flex; flex-direction: column; gap: 8px;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: calc(12px + env(safe-area-inset-right, 0px));
  }
  .controls button {
    width: 44px; height: 44px; border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(20, 20, 24, 0.72); color: #e6e8ec;
    font: 600 20px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .controls button:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }
  .credit {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px));
    background: rgba(0, 0, 0, 0.65); color: #b8bcc4;
    font: 12px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .credit a { color: #e6e8ec; pointer-events: auto; }
  .credit.hide { opacity: 0; }
  .credit.hide a { pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .credit { transition: none; } }
  #msg {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 24px; text-align: center; pointer-events: none;
    color: #b8bcc4; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="Andromeda Galaxy image. Drag to pan, scroll or pinch to zoom."></canvas>
<div id="msg"></div>
<div class="controls">
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zout" aria-label="Zoom out">−</button>
  <button id="fit" aria-label="Fit image to screen">Fit</button>
</div>
<div class="credit">
  Sharpest ever view of the Andromeda Galaxy.
  Image: NASA, ESA, J. Dalcanton, B. F. Williams, L. C. Johnson (University of Washington),
  the PHAT team, and R. Gendler.
  <a href="https://esahubble.org/images/heic1502a/">ESA/Hubble</a>,
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
</div>

<script>
(function () {
  // Folder that holds the Zoomify tiles (TileGroup0, TileGroup1, ...). Must end with "/".
  // If you tile the image yourself with libvips:
  //   vips dzsave andromeda.tif andromeda --layout zoomify --tile-size 256 --overlap 0 --suffix .jpg[Q=80]
  var TILES_URL = "https://pub-677efaba17ee45dcb62fd77015a5a203.r2.dev/andromeda/";
  // How far you can zoom in, in screen pixels per image pixel.
  // About 1 = how far the first version went on an iPhone, 3 = how far ESA's own viewer goes.
  var MAX_ZOOM = 1.5;
  var W = 69536, H = 22230, T = 256;   // full image size and tile size in pixels

  // ---- Zoomify pyramid: level 0 is the smallest, the last level is full size ----
  var levels = [{ w: W, h: H }];
  while (levels[0].w > T || levels[0].h > T) {
    levels.unshift({ w: Math.ceil(levels[0].w / 2), h: Math.ceil(levels[0].h / 2) });
  }
  var MAXL = levels.length - 1, offset = 0, BASE = 0;
  levels.forEach(function (L, i) {
    L.cols = Math.ceil(L.w / T); L.rows = Math.ceil(L.h / T);
    L.offset = offset; offset += L.cols * L.rows;
    L.fx = W / L.w; L.fy = H / L.h;            // image pixels per level pixel
    if (L.cols * L.rows <= 4) BASE = i;        // tiny levels are always kept loaded
  });
  function tileUrl(l, x, y) {
    var L = levels[l], idx = L.offset + y * L.cols + x;
    return TILES_URL + "TileGroup" + Math.floor(idx / 256) + "/" + l + "-" + x + "-" + y + ".jpg";
  }

  // ---- State ----
  var cv = document.getElementById("view"), ctx = cv.getContext("2d"), msg = document.getElementById("msg"), credit = document.querySelector(".credit");
  var REDUCE = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  var dpr = 1, vw = 0, vh = 0, minZ = 0.01, maxZ = 3;
  var cx = W / 2, cy = H / 2, z = minZ;          // view centre (image px) and zoom (CSS px per image px)
  var anim = null, vx = 0, vy = 0, fading = false;
  var raf = 0, lastT = 0, frame = 0;
  var cache = new Map(), needed = [], inflight = 0, MAX_INFLIGHT = 6, MAX_CACHED = 300;

  function toImg(sx, sy) { return { x: cx + (sx - vw / 2) / z, y: cy + (sy - vh / 2) / z }; }

  function clampView() {
    z = Math.min(maxZ, Math.max(minZ, z));
    var hw = vw / (2 * z), hh = vh / (2 * z);
    cx = W <= 2 * hw ? W / 2 : Math.min(W - hw, Math.max(hw, cx));
    cy = H <= 2 * hh ? H / 2 : Math.min(H - hh, Math.max(hh, cy));
  }

  function resize() {
    var atFit = z <= minZ * 1.001;
    dpr = window.devicePixelRatio || 1;
    vw = window.innerWidth; vh = window.innerHeight;
    cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
    minZ = Math.min(vw / W, vh / H);
    maxZ = MAX_ZOOM;
    if (atFit) z = minZ;
    clampView(); invalidate();
  }

  // ---- Tile loading ----
  function load(n) {
    var e = { img: new Image(), state: "loading", t0: 0, used: frame, base: n.l <= BASE, failed: 0 };
    cache.set(n.key, e); inflight++;
    e.img.decoding = "async";
    e.img.onload = function () {
      e.state = "ok"; e.t0 = performance.now(); msg.style.display = "none"; finish();
    };
    e.img.onerror = function () {
      e.state = "error"; e.failed = performance.now();
      if (n.key === "0-0-0") {
        msg.textContent = "Couldn't load the image tiles from " + TILES_URL +
          ". Check TILES_URL in this file and that the tile folder is publicly reachable.";
        msg.style.display = "flex";
      }
      setTimeout(invalidate, 5200);              // retry failed tiles after a pause
      finish();
    };
    e.img.src = tileUrl(n.l, n.x, n.y);
  }
  function finish() { inflight--; invalidate(); pump(); }
  function pump() {
    while (inflight < MAX_INFLIGHT && needed.length) {
      var n = needed.shift();
      if (!cache.has(n.key)) load(n);
    }
  }
  function evict() {
    if (cache.size <= MAX_CACHED) return;
    var arr = [];
    cache.forEach(function (e, k) { if (!e.base && e.state !== "loading") arr.push([k, e.used]); });
    arr.sort(function (a, b) { return a[1] - b[1]; });
    for (var i = 0; i < arr.length && cache.size > MAX_CACHED * 0.8; i++) cache.delete(arr[i][0]);
  }

  // ---- Drawing ----
  function render(now) {
    frame++; fading = false; needed = [];
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "medium";

    // Lowest-resolution level that is still sharp on this screen
    var target = MAXL;
    for (var i = 0; i <= MAXL; i++) if (z * dpr * levels[i].fx <= 1.25) { target = i; break; }

    var hx = vw / 2 / z, hy = vh / 2 / z;
    for (var l = 0; l <= target; l++) {          // coarse levels first, so finer tiles fade in on top
      var L = levels[l];
      var x0 = Math.max(0, Math.floor((cx - hx) / L.fx / T)), x1 = Math.min(L.cols - 1, Math.floor((cx + hx) / L.fx / T));
      var y0 = Math.max(0, Math.floor((cy - hy) / L.fy / T)), y1 = Math.min(L.rows - 1, Math.floor((cy + hy) / L.fy / T));
      for (var ty = y0; ty <= y1; ty++) {
        for (var tx = x0; tx <= x1; tx++) {
          var key = l + "-" + tx + "-" + ty, e = cache.get(key);
          if (e && e.state === "error" && now - e.failed > 5000) { cache.delete(key); e = null; }
          if (!e) {
            if (l <= BASE || l === target || l === target - 2) {
              var d = Math.hypot((tx + 0.5) * T * L.fx - cx, (ty + 0.5) * T * L.fy - cy);
              needed.push({ l: l, x: tx, y: ty, key: key, p: l <= BASE ? -1 : (l === target ? d : d + 1e9) });
            }
            continue;
          }
          e.used = frame;
          if (e.state !== "ok") continue;
          var a = REDUCE ? 1 : Math.min(1, (now - e.t0) / 220);
          if (a < 1) fading = true;
          // Snap to whole device pixels so neighbouring tiles leave no hairline gaps
          var px0 = Math.floor(((tx * T * L.fx - cx) * z + vw / 2) * dpr);
          var px1 = Math.ceil(((Math.min((tx + 1) * T, L.w) * L.fx - cx) * z + vw / 2) * dpr);
          var py0 = Math.floor(((ty * T * L.fy - cy) * z + vh / 2) * dpr);
          var py1 = Math.ceil(((Math.min((ty + 1) * T, L.h) * L.fy - cy) * z + vh / 2) * dpr);
          ctx.globalAlpha = a;
          ctx.drawImage(e.img, px0, py0, px1 - px0, py1 - py0);
        }
      }
    }
    ctx.globalAlpha = 1;
    needed.sort(function (p, q) { return p.p - q.p; });
    pump(); evict();
    credit.classList.toggle("hide", z > minZ * 1.02);   // visible at the full view, faded out when zoomed in
  }

  // ---- Animation loop (runs only while something is moving) ----
  function invalidate() { if (!raf) raf = requestAnimationFrame(tick); }
  function place(a) { cx = a.ix - (a.sx - vw / 2) / z; cy = a.iy - (a.sy - vh / 2) / z; }

  function tick(now) {
    raf = 0;
    var dt = Math.min(64, now - (lastT || now)); lastT = now;
    var moving = false;
    if (anim) {
      var lz = Math.log(z), lt = Math.log(anim.tz);
      if (REDUCE || Math.abs(lt - lz) < 0.0008) { z = anim.tz; place(anim); anim = null; }
      else { z = Math.exp(lz + (lt - lz) * (1 - Math.exp(-dt / 120))); place(anim); moving = true; }
    }
    if (!ptrs.size && (vx || vy)) {              // momentum after a flick
      cx -= vx * dt / z; cy -= vy * dt / z;
      var k = Math.exp(-dt / 280); vx *= k; vy *= k;
      if (Math.hypot(vx, vy) < 0.03) vx = vy = 0; else moving = true;
    }
    clampView();
    render(now);
    if (moving || fading) raf = requestAnimationFrame(tick); else lastT = 0;
  }

  // ---- Zoom helpers ----
  function zoomTo(tz, sx, sy) {
    tz = Math.min(maxZ, Math.max(minZ, tz));
    var p = toImg(sx, sy);
    anim = { tz: tz, sx: sx, sy: sy, ix: p.x, iy: p.y };
    vx = vy = 0; invalidate();
  }
  function zoomBy(f, sx, sy) { zoomTo((anim ? anim.tz : z) * f, sx, sy); }
  function fit() { zoomTo(minZ, vw / 2, vh / 2); }

  // ---- Touch, mouse and pen ----
  var ptrs = new Map(), g = null, lastTap = null;
  function pts() { return Array.from(ptrs.values()); }
  function startPinch() {
    var q = pts();
    g.multi = true; g.moved = true;
    g.d0 = Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y) || 1;
    g.z0 = z;
    g.ia = toImg((q[0].x + q[1].x) / 2, (q[0].y + q[1].y) / 2);
  }

  cv.addEventListener("pointerdown", function (e) {
    cv.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    anim = null; vx = vy = 0;
    cv.classList.add("dragging");
    if (ptrs.size === 1) {
      g = { t: e.timeStamp, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, lt: e.timeStamp, moved: false, multi: false };
    } else if (g) {
      startPinch();
    }
  });

  cv.addEventListener("pointermove", function (e) {
    var p = ptrs.get(e.pointerId);
    if (!p || !g) return;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size >= 2) {
      var q = pts();
      var mx = (q[0].x + q[1].x) / 2, my = (q[0].y + q[1].y) / 2;
      var d = Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y) || 1;
      z = Math.min(maxZ, Math.max(minZ, g.z0 * d / g.d0));
      cx = g.ia.x - (mx - vw / 2) / z; cy = g.ia.y - (my - vh / 2) / z;   // image point stays under the fingers
    } else {
      var dx = e.clientX - g.lx, dy = e.clientY - g.ly, dt = Math.max(1, e.timeStamp - g.lt);
      if (Math.hypot(e.clientX - g.x, e.clientY - g.y) > 8) g.moved = true;
      cx -= dx / z; cy -= dy / z;
      vx = 0.6 * vx + 0.4 * dx / dt; vy = 0.6 * vy + 0.4 * dy / dt;
      g.lx = e.clientX; g.ly = e.clientY; g.lt = e.timeStamp;
    }
    clampView(); invalidate();
  });

  function up(e) {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size >= 2) { startPinch(); return; }
    if (ptrs.size === 1) {                       // one finger left after a pinch: carry on dragging from here
      var r = pts()[0];
      g.x = g.lx = r.x; g.y = g.ly = r.y; g.lt = e.timeStamp; vx = vy = 0;
      return;
    }
    cv.classList.remove("dragging");
    var wasTap = !g.multi && !g.moved && e.type === "pointerup" && e.timeStamp - g.t < 350;
    var flick = !g.multi && g.moved && e.timeStamp - g.lt < 80 && !REDUCE;
    if (!flick) vx = vy = 0;
    if (wasTap) tap(e.clientX, e.clientY, e.timeStamp);
    g = null; invalidate();
  }
  cv.addEventListener("pointerup", up);
  cv.addEventListener("pointercancel", up);

  function tap(x, y, t) {
    if (lastTap && t - lastTap.t < 320 && Math.hypot(x - lastTap.x, y - lastTap.y) < 30) {
      lastTap = null;
      var base = anim ? anim.tz : z;
      if (base >= maxZ * 0.95) fit(); else zoomTo(base * 2.5, x, y);   // double-tap zooms in, then back out
    } else {
      lastTap = { x: x, y: y, t: t };
    }
  }

  cv.addEventListener("wheel", function (e) {
    e.preventDefault();
    var dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
    zoomBy(Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0022)), e.clientX, e.clientY);
  }, { passive: false });

  cv.addEventListener("keydown", function (e) {
    var k = e.key, step = 80 / z;
    if (k === "+" || k === "=") zoomBy(1.6, vw / 2, vh / 2);
    else if (k === "-" || k === "_") zoomBy(1 / 1.6, vw / 2, vh / 2);
    else if (k === "0") fit();
    else if (k === "ArrowLeft") cx -= step;
    else if (k === "ArrowRight") cx += step;
    else if (k === "ArrowUp") cy -= step;
    else if (k === "ArrowDown") cy += step;
    else return;
    e.preventDefault(); clampView(); invalidate();
  });

  document.getElementById("zin").addEventListener("click", function () { zoomBy(2, vw / 2, vh / 2); });
  document.getElementById("zout").addEventListener("click", function () { zoomBy(0.5, vw / 2, vh / 2); });
  document.getElementById("fit").addEventListener("click", fit);

  window.addEventListener("resize", resize);
  resize();
})();
</script>
</body>
</html>
